[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydrarank"
version = "0.1.0"
description = "Light-weight hydration-site analysis: find water molecules that are entropically favourable to displace with a ligand."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alessio Prunotto" }]
keywords = ["molecular-dynamics", "hydration-sites", "water", "entropy", "drug-design"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "MDAnalysis>=2.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.scripts]
hydrarank = "hydrarank.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hydrarank"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
